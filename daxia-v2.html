    <!-- Which language to open in. Cloudflare's edge answers /cdn-cgi/trace on
         every proxied zone, so the country costs no extra request and no
         third-party hop. Started here, before the bundle, so the answer is
         usually in hand by the time React mounts; see i18n.ts. -->
    <script>
      window.__stGeo = fetch('/cdn-cgi/trace', { cache: 'no-store' })
        .then(function (r) {
          return r.ok ? r.text() : '';
        })
        .then(function (body) {
          var m = /^loc=(.+)$/m.exec(body);
          return m ? m[1].trim() : '';
        })
        .catch(function () {
          return '';
        });
    </script>
