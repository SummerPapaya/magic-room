<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Summer's Magic Room — wand sequence hero</title>
  <desc id="desc">A warm indigo reading room with one arch window, books, flowers, a crystal ball, and an upright wand that releases fireworks, snow, and petals in sequence.</desc>
