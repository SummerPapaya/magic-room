    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#414776"/><stop offset="1" stop-color="#282c50"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dab98c"/><stop offset="1" stop-color="#a5795f"/></linearGradient>
    <radialGradient id="crystal"><stop stop-color="#fff4e0"/><stop offset=".35" stop-color="#c5c1f1"/><stop offset="1" stop-color="#7f7bb0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="crop"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
